[project]
name = "mujoco-robot-sorting"
version = "0.1.0"
description = "MuJoCo robot arm sorting simulation with external inspection module"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mujoco>=3.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.7.0",
]

[project.scripts]
robot-sort = "robot_sorting.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_sorting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "integration: MuJoCo integration tests",
    "safety: robot safety and workspace tests",
    "latency: command latency tests",
    "rendering: tests that require camera rendering or OpenGL/OSMesa",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "SIM", "RUF"]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
